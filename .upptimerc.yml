owner: getreica
repo: status-page
user-agent: getreica

sites:
  - name: Reica Website
    url: $WEBSITE_URL
  - name: Product Service
    url: $PRODUCT_API_URL
    method: GET
    headers:
      - "X-Health-Token: $HEALTH_CHECK_TOKEN"
  - name: API Service
    url: $API_URL
    method: GET
    headers:
      - "X-Health-Token: $HEALTH_CHECK_TOKEN"
  - name: Database
    url: $SUPABASE_URL
    expectedStatusCodes:
      - 200
      - 401
      - 404

status-website:
  cname: status.getreica.com
  customHeadHtml: >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  css: |
    :root {
      --body-background-color: #ffffff;
      --body-text-color: #171717;
      --card-background-color: #ffffff;
      --nav-background-color: #ffffff;
      --nav-border-bottom-color: #e4e4e4;
      --nav-current-border-bottom-color: #171717;
      --card-border-color: #e4e4e4;
      --down-border-left-color: #b91c1c;
      --down-background-color: #ffffff;
      --degraded-border-left-color: #b45309;
      --up-border-left-color: #e4e4e4;
      --tag-color: #171717;
      --tag-up-background-color: transparent;
      --tag-down-background-color: transparent;
      --tag-degraded-background-color: transparent;
      --change-background-color: #f4f4f4;
      --error-button-border-color: #d4d4d4;
      --error-button-background-color: #ffffff;
      --error-button-color: #171717;
      --submit-button-border-color: #171717;
      --submit-button-background-color: #171717;
      --submit-button-color: #ffffff;
      --code-color: #171717;
      --code-background-color: #f4f4f4;
      --down-color-color: #b91c1c;
      --degraded-color-color: #b45309;
      --up-color-color: #15803d;
      --graph-opacity: 1;
      --graph-filter: grayscale(1) contrast(0.9);
    }

    html { background: #ffffff; }

    body {
      font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      background: #ffffff;
      color: #171717;
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "tnum" 1;
    }

    nav { border-bottom: 1px solid #e4e4e4; }
    nav .container, main.container, footer .container { max-width: 1120px; }

    nav a {
      padding: 1rem 0.875rem;
      color: #767676;
      font-size: 0.875rem;
      font-weight: 500;
      transition: color 100ms;
    }

    nav a:hover, [aria-current] { color: #171717; }

    nav .logo {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-transform: lowercase;
      color: #171717;
    }

    nav .logo img { width: 22px; height: 22px; }

    main.container { padding-top: 4rem; }

    header { max-width: 860px; margin-bottom: 2.5rem; }

    h1, h2, h3, h4 { letter-spacing: -0.02em; }

    h1 {
      font-size: clamp(2.625rem, 6vw, 4.5rem);
      font-weight: 600;
      line-height: 0.98;
      letter-spacing: -0.035em;
      margin-bottom: 1rem;
    }

    h1 strong { color: #1e5bd7; font-weight: 600; }

    p.lead {
      max-width: 38rem;
      font-size: 1.1875rem;
      line-height: 1.5;
      color: #767676;
    }

    h2 {
      margin-bottom: 0.75rem;
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #767676;
    }

    h3 { color: #767676; font-weight: 500; }

    a { color: #1e5bd7; transition: color 100ms; }

    article {
      border: 1px solid #e4e4e4;
      border-left-width: 1px;
      border-radius: 6px;
      box-shadow: none;
      background: #ffffff;
    }

    article + article { margin-top: 0.5rem; }
    article.down-active { border-color: #b91c1c; }
    article.degraded-active { border-color: #b45309; }
    article h4 { font-weight: 600; }

    article.graph {
      background-size: 46% auto;
      background-position: center right 1.25rem;
    }

    /* States: a small square swatch plus a word, never colour alone. */
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0;
      border-radius: 0;
      background: transparent !important;
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: 0;
    }

    .tag::before {
      content: "";
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 2px;
      background: currentColor;
    }

    .tag.up { color: #15803d; }
    .tag.down { color: #b91c1c; }
    .tag.degraded { color: #b45309; }

    .r label {
      display: inline-flex;
      align-items: center;
      margin-left: 0.375rem;
      padding: 0.25rem 0.625rem;
      border: 1px solid #d4d4d4;
      border-radius: 6px;
      background: #ffffff;
      font-size: 0.8125rem;
    }

    .r input:checked + label {
      background: #171717;
      color: #ffffff;
      border-color: #171717;
    }

    a.error-button, .submit-button {
      border-radius: 6px;
      padding: 0.5rem 1rem;
      font-weight: 500;
    }

    footer { color: #767676; border-top: 1px solid #e4e4e4; font-size: 0.875rem; }

    @media (prefers-color-scheme: dark) {
      :root {
        --body-background-color: #161616;
        --body-text-color: #ededed;
        --card-background-color: #161616;
        --nav-background-color: #161616;
        --nav-border-bottom-color: #2f2f2f;
        --nav-current-border-bottom-color: #ededed;
        --card-border-color: #2f2f2f;
        --up-border-left-color: #2f2f2f;
        --change-background-color: #1f1f1f;
        --code-background-color: #1f1f1f;
        --code-color: #ededed;
        --submit-button-background-color: #ededed;
        --submit-button-border-color: #ededed;
        --submit-button-color: #161616;
        --error-button-background-color: #161616;
        --error-button-color: #ededed;
        --error-button-border-color: #3a3a3a;
        --graph-filter: grayscale(1) invert(0.85);
      }
      html, body, article { background: #161616; color: #ededed; }
      nav, footer { border-color: #2f2f2f; }
      article { border-color: #2f2f2f; }
      nav .logo, nav a:hover, [aria-current] { color: #ededed; }
      nav a, p.lead, h2, h3, footer { color: #a3a3a3; }
      h1 strong, a { color: #6e9bff; }
      .tag.up { color: #4ade80; }
      .tag.down { color: #f87171; }
      .tag.degraded { color: #f59e0b; }
      .r label { background: #161616; border-color: #3a3a3a; }
      .r input:checked + label { background: #ededed; color: #161616; border-color: #ededed; }
    }

    @media (max-width: 720px) {
      nav a { padding: 0.875rem 0.625rem; }
      main.container { padding-top: 2.5rem; }
      article.graph { background-size: 65% auto; background-position: bottom right; }
    }
  logoUrl: https://docs.getreica.com/img/mark.svg
  logoHref: https://getreica.com
  name: reica
  introTitle: Reica service **status.**
  introMessage: Live availability, response times and incident history of the Reica app, its API, the database and the website.
  favicon: https://docs.getreica.com/img/favicon.svg
  navbar:
    - title: Status
      href: /
    - title: Documentation
      href: https://docs.getreica.com
      target: _blank
    - title: Support
      href: https://docs.getreica.com/support
      target: _blank
    - title: Website
      href: https://getreica.com
      target: _blank
